<title>Re-design 길잡이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: every screen is one prescription slip on a desk; questions fill it in, the result is the finished slip. */
:root{
  --desk:#e6ecee;
  --paper:#fcfdfd;
  --ink:#14262e;
  --muted:#566a73;
  --rule:#cfdadd;
  --accent:#17696f;
  --accent-ink:#ffffff;
  --tint:#eef5f5;
  --stamp:#b5412c;
  --font-display:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --desk:#0d171b;--paper:#14232a;--ink:#e4eef0;--muted:#94aab3;--rule:#2a3f47;
    --accent:#5cc4c8;--accent-ink:#0b1a1d;--tint:#1a2f35;--stamp:#ff9a82;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#0d171b;--paper:#14232a;--ink:#e4eef0;--muted:#94aab3;--rule:#2a3f47;
  --accent:#5cc4c8;--accent-ink:#0b1a1d;--tint:#1a2f35;--stamp:#ff9a82;color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.35;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:700}
h2{font-size:1.45rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.1em;color:var(--muted);font-weight:500;text-transform:uppercase}
.slip{background:var(--paper);border-radius:6px;box-shadow:0 1px 0 var(--rule),0 12px 28px -18px rgba(10,30,40,.45);border-top:3px solid var(--accent);animation:rise .28s ease-out}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.slip{animation:none}}
.slip-head{display:flex;align-items:center;gap:16px;padding:18px 24px 16px;border-bottom:1px dashed var(--rule)}
.rxmark{font-family:var(--font-display);font-weight:700;font-size:1.9rem;line-height:1;color:var(--stamp);letter-spacing:-.04em;flex:none}
.slip-head.big .rxmark{font-size:3rem}
.qh{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.qprog{display:flex;gap:5px}
.qprog i{height:4px;flex:1;border-radius:2px;background:var(--rule)}
.qprog i.on{background:var(--accent)}
.body{padding:22px 24px 26px;display:flex;flex-direction:column;gap:18px}
.lead{color:var(--muted)}
.dx{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;font-size:.95rem}
.dx dt{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.08em;color:var(--muted);padding-top:4px}
.dx dd{margin:0;min-width:0}
.opts{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.opt{all:unset;box-sizing:border-box;display:grid;grid-template-columns:2.4rem 1fr;gap:12px;align-items:start;width:100%;padding:14px 8px;border-bottom:1px dotted var(--rule);cursor:pointer;line-height:1.55}
.opt .k{font-family:var(--font-display);font-weight:600;color:var(--muted);width:1.9rem;height:1.9rem;border:1px solid var(--rule);border-radius:50%;display:grid;place-items:center;font-size:.85rem;transition:background .12s,color .12s,border-color .12s}
.opt small{display:block;color:var(--muted);font-size:.85rem}
.opt:hover{background:var(--tint)}
.opt:hover .k,.opt[aria-pressed="true"] .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--tint);font-weight:500}
.opt[aria-pressed="true"] .k::after{content:"✓"}
.opt[aria-pressed="true"] .k{font-size:0}
.opt[aria-pressed="true"] .k::after{font-size:.9rem}
.opt:focus-visible,.btn:focus-visible,.chipbtn:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px}
.crumb{font-size:.82rem;background:var(--tint);padding:2px 10px;border-radius:99px;border:1px solid var(--rule)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 18px;border-radius:6px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font-weight:500;font-size:.95rem}
a.btn{display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
label.field{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--muted)}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--tint);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;width:100%}
textarea{min-height:260px;resize:vertical;line-height:1.65}
.hint{font-size:.85rem;color:var(--muted)}
.ok{color:var(--accent);font-size:.88rem;font-weight:500}
.strips{display:flex;flex-direction:column;gap:9px}
.strip{display:grid;grid-template-columns:minmax(0,11.5rem) minmax(0,1fr) 3.4rem;gap:12px;align-items:center;font-size:.9rem}
.strip .t{height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.strip .t span{display:block;height:100%;background:var(--accent);opacity:.4}
.strip.top .t span{opacity:1}
.strip.top > span:first-child{font-weight:600}
.strip .f{font-family:var(--font-mono);font-size:.7rem;font-weight:600;color:var(--stamp);text-align:right;letter-spacing:.06em}
@media (max-width:480px){.strip{grid-template-columns:1fr 3.4rem}.strip .t{grid-column:1 / -1;order:3}}
.secthead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:20px 24px 4px}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:6px 24px 12px}
.chipbtn{all:unset;box-sizing:border-box;cursor:pointer;font-size:.84rem;padding:4px 12px;border-radius:99px;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.item{position:relative;border-top:1px dotted var(--rule);padding:18px 24px;display:flex;flex-direction:column;gap:10px}
.item[hidden]{display:none}
.item.picked::after{content:"담음";position:absolute;right:20px;top:14px;font-family:var(--font-display);font-weight:700;font-size:.8rem;color:var(--stamp);border:2px solid var(--stamp);border-radius:4px;padding:1px 8px;transform:rotate(-7deg);opacity:.9;pointer-events:none}
.ihead{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline}
.rxn{font-family:var(--font-mono);font-weight:600;font-size:.8rem;color:var(--stamp)}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lv{font-size:.74rem;font-weight:700;padding:1px 9px;border-radius:99px;border:1px solid currentColor}
.lv.now{color:var(--accent)}
.lv.class{color:#8a5a00}
.lv.prep{color:var(--stamp)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lv.class{color:#f0c36a}}
:root[data-theme="dark"] .lv.class{color:#f0c36a}
.elt{font-size:.78rem;color:var(--muted)}
.item details{margin-top:2px}
.item summary{cursor:pointer;list-style:none;font-size:.88rem;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:6px;width:fit-content}
.item summary::-webkit-details-marker{display:none}
.item summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.item details[open] summary::before{transform:rotate(45deg)}
.det{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.lab{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.det ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.say{border-left:3px solid var(--stamp);padding:2px 0 2px 12px}
.exb{background:var(--tint);border-radius:6px;padding:10px 12px;font-size:.93rem}
.kv{font-size:.9rem;color:var(--muted)}
.kv b{color:var(--ink);font-weight:500}
.why{font-size:.8rem;color:var(--muted)}
.why b{font-weight:500;color:var(--ink)}
.sumbox{border-top:1px dashed var(--rule);padding:22px 24px 26px;display:flex;flex-direction:column;gap:14px}
.sig{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:1px solid var(--rule);padding:12px 24px 14px;font-family:var(--font-mono)}
.brow{display:grid;gap:5px;padding:2px 0}
.brow .l{font-size:.93rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.brow .l small{color:var(--muted)}
.brow .bt{display:grid;grid-template-columns:minmax(0,1fr) 3.6rem;gap:10px;align-items:center}
.brow .tr{height:10px;background:var(--rule);border-radius:5px;overflow:hidden}
.brow .tr span{display:block;height:100%;background:var(--accent);opacity:.45}
.brow.hot .tr span{opacity:1}
.brow .n{font-family:var(--font-mono);font-size:.78rem;font-weight:600;text-align:right;color:var(--ink)}
.brow.hot .n{color:var(--stamp)}
.together{font-size:.72rem;font-weight:700;color:var(--stamp);border:1px solid currentColor;border-radius:99px;padding:0 8px}
.bigline{font-size:1rem}
.bigline b{font-family:var(--font-display);font-size:2rem;line-height:1;color:var(--accent);margin-right:6px}
.sendbox{border-top:1px dashed var(--rule);padding:22px 24px 8px;display:flex;flex-direction:column;gap:12px}
.bsec{display:flex;flex-direction:column;gap:12px;padding-top:6px}
</style>

<div class="wrap" id="app"></div>

<script>
const EL = {G:"수업 목표 제시",A:"학습 활동 제시",T:"AI·디지털 기술의 역할",L:"학생의 학습과정",S:"교사의 지원",E:"평가"};
const ELKEYS = ["G","A","T","L","S","E"];

/* 처방 라이브러리: t 제목, el 관련 요소, tip 이렇게 하면 좋다, how 해 볼 일, say 발문·문장틀, ex 수업 예시, ev 남길 증거 */
const RX = {
r_interpret:{t:"그래프를 만든 뒤 ‘해석 질문’으로 먼저 말해 보기",el:["A","S"],
 tip:"결과를 바로 글로 쓰게 하면 수치 나열로 끝나기 쉬워요. 질문으로 먼저 말하게 한 다음 쓰게 하세요.",
 how:["(3분) 그래프가 나오면 모둠이 ‘가장 큰 것은? 가장 작은 것은? 예상과 다른 점은?’ 세 질문에 말로 답합니다.","(2분) ‘그래서 왜 그럴까?’에 대한 이유 가설을 한 문장씩 활동지에 적습니다.","(5분) 그 문장을 첫 문장으로 삼아 기사문·보고서를 씁니다."],
 say:"“수치를 읽는 것은 해석이 아니에요. 이 숫자 뒤에 어떤 이야기가 숨어 있을까요?”",
 ex:"‘우리 반이 가장 좋았던 학년’ 띠그래프에서 ‘5학년이 40%로 가장 많다’를 읽은 뒤, ‘체험학습이 있었기 때문일까?’ 가설을 쓰고 기사문 첫 문장으로 씁니다.",
 ev:"이유 가설 문장, 기사문 수정 전·후"},
r_guess:{t:"분석·예측 전에 내 예상을 먼저 쓰기",el:["L","A"],
 tip:"예상 → 결과 비교 → 이유 쓰기 순서로 하면 결과를 받아 적기만 하는 일이 줄어요.",
 how:["(1분) 결과를 보여 주기 전에 ‘이럴 것 같다’를 한 줄로 쓰고 이름을 적어 둡니다.","(2분) 결과가 나오면 예상과 같은 점·다른 점을 두 칸에 적습니다.","(3분) 다른 점에 대해 ‘왜 달랐을까?’ 이유를 쓰고 짝에게 말합니다."],
 say:"“결과를 보기 전에 먼저 예상해 볼까요? 틀려도 괜찮아요. 틀린 이유가 오늘의 배움이에요.”",
 ex:"엔트리로 100년 뒤 기온을 예측하기 전에 ‘얼마일 것 같은지’를 쓰고, 예측값과 비교해 ‘예상보다 높은/낮은 이유’를 활동지에 적습니다.",
 ev:"예상 메모, 같은 점·다른 점, 이유 한 줄"},
r_reason:{t:"주제·항목을 고른 이유를 적고 선택하기",el:["L"],
 tip:"고르는 기준을 주면 흥미 위주로 고르는 일이 줄고, 해석할 거리가 많은 주제를 고르게 돼요.",
 how:["(3분) 모둠이 후보를 3개 이상 적습니다.","(3분) 기준표(탐구 목적에 맞는가 / 조사할 수 있는가 / 그래프로 알 수 있는 사실이 많은가)에 ○△×를 표시합니다.","(1분) 최종 선택과 이유를 한 줄로 적습니다."],
 say:"“재미있는 것과 알아낼 것이 많은 것은 달라요. 이 항목으로 어떤 사실을 알 수 있을까요?”",
 ex:"‘선생님 별명 설문’ 항목에 ‘100세 이상’을 넣고 싶을 때, ‘이 항목으로 알 수 있는 사실이 있나?’를 기준에 비춰 보고 넣을지 정합니다.",
 ev:"후보와 기준표, 선정 이유 한 줄"},
r_roles:{t:"역할 나누기: 도구는 만들기, 학생은 고르고 확인하고 해석하기",el:["T"],
 tip:"도구가 하는 일과 학생이 하는 일을 나눠 적어 두면 사고를 대신하는 문제를 막을 수 있어요.",
 how:["수업안에 두 칸 표를 만듭니다. 왼쪽은 ‘도구가 하는 일’, 오른쪽은 ‘학생이 하는 일’.","오른쪽 칸에 선택·확인·해석 중 최소 하나가 있는지 점검합니다.","학생에게도 첫 시간에 같은 표를 보여 주고 ‘오늘 내가 맡은 일’을 말하게 합니다."],
 say:"“그래프는 웹앱이 만들어 줘요. 그런데 이 그래프가 맞는지, 무슨 뜻인지는 누가 정할까요?”",
 ex:"웹앱: 수치를 입력하면 띠·원그래프 자동 생성 / 학생: 항목 선정, 수치 확인(합계 100%), 해석 문장 쓰기.",
 ev:"역할 구분표(교사용), ‘오늘 내가 한 일’ 한 줄(학생용)"},
r_check:{t:"자동 결과 확인 체크: 눈금·합계·단위",el:["T","L"],
 tip:"도구가 만든 그래프도 학생이 직접 맞는지 확인하는 단계를 두세요. 확인이 곧 학습의 증거가 됩니다.",
 how:["활동지에 체크 세 칸을 둡니다: ① 세로축이 0에서 시작하는가 ② 비율 합계가 100%인가 ③ 제목·단위가 있는가.","모둠이 점검하고 이상하면 빨간 펜으로 표시합니다.","틀린 곳이 있으면 ‘왜 틀렸을까?’를 한 줄 적고 고칩니다."],
 say:"“컴퓨터가 만든 그림도 틀릴 수 있어요. 세 가지만 확인해 볼까요?”",
 ex:"입력한 수치의 합이 98%여서 그래프가 이상하게 나온 경우를 일부러 보여 주고, 학생이 오류를 찾아 고치게 합니다.",
 ev:"확인 체크표, 고친 곳과 이유"},
r_meaning:{t:"값의 의미와 한계를 확인하고, 이유는 다른 자료로 확인하기",el:["T","L"],
 tip:"검색량 그래프의 숫자는 ‘사람 수’가 아니라 ‘가장 많이 검색된 때를 100으로 둔 상대값’이에요. 값의 뜻을 먼저 읽고, ‘왜 늘었을까?’는 다른 자료로 확인하게 하세요.",
 how:["(3분) 그래프를 보여 주고 ‘세로축의 100은 무엇일까요?’를 짝끼리 말하게 합니다. 이어서 ‘100 = 가장 많이 검색된 때, 50 = 그때의 절반’을 칠판에 적습니다.","(5분) 활동지에 ‘가장 높은 때 / 가장 낮은 때 / 변화가 큰 구간’ 세 칸을 만들고 칸마다 ‘왜 그랬을까?’ 가설을 한 줄씩 적게 합니다.","(7분) 가설마다 확인할 자료를 하나씩 정합니다(뉴스 기사, 통계청 출생아 수, 정책 발표 시기). 찾은 자료로 ‘맞다 / 아니다 / 모르겠다’를 표시합니다."],
 say:"“숫자 70은 검색한 사람이 70명이라는 뜻일까요? 이 그래프만으로 ‘이유’까지 알 수 있을까요?”",
 ex:"저출산 프로젝트에서 데이터랩 그래프를 본 뒤 ‘2022년에 관심이 높아졌다 → 정책 발표 기사 확인 → 가설 맞음’으로 기록하고, 보고서에는 ‘관심도(상대값)’라고 표기합니다.",
 ev:"가설·확인한 자료·판단(맞다/아니다/모르겠다)을 적은 활동지"},
r_predict:{t:"예측은 ‘추세 연장’임을 알리고, 값이 달라지는 이유 토의하기",el:["T","S"],
 tip:"예측값은 지난 흐름을 이어 계산한 값이라 학습할 때마다 달라질 수 있어요. 그 사실을 먼저 알리고 ‘얼마나 믿을까?’를 토의하게 하세요.",

function compute(){
  const a = AREAS[st.area];
  const elScore = {G:0,A:0,T:0,L:0,S:0,E:0};
  const rx = {}; let order = 0;
  function add(id,w,src){
    if(!rx[id]) rx[id] = {id,score:0,src:src,srcW:0,order:order++};
    rx[id].score += w;
    if(w>rx[id].srcW){ rx[id].src = src; rx[id].srcW = w; }
    RX[id].el.forEach(e=>{ elScore[e]+=w; });
  }
  a.el.forEach(e=>{ elScore[e]+=2; });
  const sit = a.sits[st.sit];
  sit.rx.forEach(id=>add(id,2,sit.t));
  if(st.cause!==null){ const c = sit.cs[st.cause]; c.rx.forEach(id=>add(id,3,c.t)); }
  st.scenes.forEach(i=>{ SCENES[i].rx.forEach(id=>add(id,1,SCENES[i].t)); });
  const list = Object.values(rx).sort((x,y)=>y.score-x.score||x.order-y.order).slice(0,7);
  return {elScore,list,sit};
}

        <p class="hint">다음 단계: 이 정리를 보고 AIEDAP 설계 사이트(aiedap.or.kr/ai-class/generator)에 입력하세요.</p>
      </div>
      <div class="sendbox" id="sendbox" hidden>
        <h3>연수실에 내 선택 보내기</h3>
        <p class="hint">이름은 받지 않고, 막힌 곳·고른 답·담은 처방만 익명으로 모아 ‘연수실 결과표’에 반영합니다. 다시 보내면 내 기록이 새로 바뀝니다.</p>
        <div class="row"><button class="btn primary" data-act="send">익명으로 보내기</button><button class="btn" data-act="board">연수실 결과표 보기</button><span class="ok" id="msg2" hidden></span></div>
      </div>
      <div class="sig"><span>AIEDAP · 모듈 4</span><span>${today()}</span></div>
    </section>
    <div class="row">${backBtn()}<button class="btn" data-act="restart">처음부터 다시</button></div>`;
  buildSummary();
  setupDocx();
  setupSend();
}

function buildSummary(){
  const {list,sit} = compute();
  const picked = list.filter(r=>st.picked.has(r.id));
  const titles = picked.map(r=>RX[r.id].t);
  let t = "";
  if(st.lesson.trim()) t += "내 수업: "+st.lesson.trim()+"\n";
  t += "막힌 곳: "+AREAS[st.area].t+" > "+sit.t+"\n\n";
  t += "[한 문장 Re-design]\n";
  t += "기존에는 【　　】한 수업이었지만, 학생이 【　　】할 수 있도록 "+(titles.length? titles.slice(0,2).join(", "):"【　　】")+"을(를) 중심으로 다시 설계하였습니다.\n\n";
  if(picked.length){
    t += "[담은 처방]\n";
    picked.forEach((r,i)=>{
      const x = RX[r.id];
      t += (i+1)+". "+x.t+" ("+x.el.map(e=>EL[e]).join(", ")+" / "+LV[lvOf(r.id)]+")\n";
      x.how.forEach(h=>{ t += "   - "+h+"\n"; });
      t += "   이렇게 말해 보세요: "+x.say+"\n";
      t += "   수업 예시: "+x.ex+"\n";
      t += "   남길 증거: "+x.ev+"\n";
    });
  }
  const ta = document.getElementById("out");
  if(ta) ta.value = t;
}


/* ===== 연수실 결과표: 선택값만 익명으로 구글 시트에 모읍니다 ===== */
/* 구글 Apps Script 웹앱 주소(끝이 /exec)를 아래 따옴표 안에 넣으세요. 비워 두면 결과표 기능이 꺼집니다. */
const SCRIPT_URL = "";
const board = {docs:[], ready:false, err:""};
let uid = null;
try{
  uid = localStorage.getItem("rg_uid");
  if(!uid){ uid = (window.crypto && crypto.randomUUID)? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2)); localStorage.setItem("rg_uid", uid); }
}catch(_){ uid = Date.now().toString(36)+Math.random().toString(36).slice(2); }
function validDoc(d){
  return d && Number.isInteger(d.area) && d.area>=0 && d.area<AREAS.length
    && Number.isInteger(d.sit) && d.sit>=0 && d.sit<AREAS[d.area].sits.length
    && Array.isArray(d.picked) && Array.isArray(d.top);
}
async function loadBoard(){
  if(!SCRIPT_URL) return;
  try{
    const r = await fetch(SCRIPT_URL+"?action=list", {redirect:"follow"});
    const j = await r.json();
    board.docs = (j.rows||[]).filter(validDoc); board.ready = true; board.err = "";
  }catch(_){ board.err = "net"; }
  if(st.step==="board") renderBoard();
}
function initShared(){
  if(!SCRIPT_URL) return;
  const b = document.getElementById("boardBtn"); if(b) b.hidden = false;
  setupSend(); loadBoard();
  setInterval(()=>{ if(st.step==="board") loadBoard(); }, 15000);
}
function topTwo(elScore){
  return [...ELKEYS].sort((x,y)=>elScore[y]-elScore[x]).slice(0,2).filter(k=>elScore[k]>0);
}
function setupSend(){
  const box = document.getElementById("sendbox"); if(box) box.hidden = !SCRIPT_URL;
}
async function sendMine(){
  const {elScore} = compute();
  const a = AREAS[st.area], sit = a.sits[st.sit];
  const picked = [...st.picked].filter(id=>RX[id]), top = topTwo(elScore);
  const doc = {id:uid, area:st.area, sit:st.sit, cause:st.cause===null?-1:st.cause, scenes:[...st.scenes], picked, top,
    labels:{area:a.t, sit:sit.t, cause:st.cause===null?"":sit.cs[st.cause].t, picked:picked.map(id=>RX[id].t), top:top.map(k=>EL[k])}};
  try{
    const r = await fetch(SCRIPT_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(doc), redirect:"follow"});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||"fail");
    flash("보냈어요. 연수실 결과표에서 확인해 보세요.","msg2");
  }catch(_){
    flash("보내지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.","msg2");
  }
}
function brow(label,count,max,hot,extra){
  const pct = max? Math.round(count/max*100):0;
  return `<div class="brow ${hot?"hot":""}"><div class="l"><span>${label}</span>${extra||""}</div><div class="bt"><span class="tr"><span style="width:${pct}%"></span></span><span class="n">${count}명</span></div></div>`;
}
function renderBoard(){
  const docs = board.docs, n = docs.length;
  let inner = "";
  if(board.err && !board.ready){
    inner = `<p class="lead">결과표를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</p>`;
  }else if(!board.ready){
    inner = `<p class="lead">불러오는 중이에요…</p>`;
  }else if(n===0){
    inner = `<p class="lead">아직 보낸 선생님이 없어요. 길잡이를 끝까지 따라가서 ‘익명으로 보내기’를 누르면 여기에 쌓입니다.</p>`;
  }else{
    const areaC = AREAS.map(()=>0), sitC = {}, rxC = {}, elC = {}; ELKEYS.forEach(k=>elC[k]=0);
    docs.forEach(d=>{
      areaC[d.area]++;
      const key = d.area+":"+d.sit; sitC[key] = (sitC[key]||0)+1;
      new Set(d.picked).forEach(id=>{ if(RX[id]) rxC[id]=(rxC[id]||0)+1; });
      new Set(d.top).forEach(k=>{ if(EL[k]) elC[k]++; });
    });
    const topArea = areaC.indexOf(Math.max(...areaC));
    const sits = Object.entries(sitC).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const rxs = Object.entries(rxC).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const elMax = Math.max(...ELKEYS.map(k=>elC[k]),1), arMax = Math.max(...areaC,1);
    const elOrder = [...ELKEYS].sort((x,y)=>elC[y]-elC[x]);
    inner = `
      <div class="bigline"><b>${n}</b><span>명이 보냈어요. 가장 많이 막힌 곳은 <strong>${AREAS[topArea].t}</strong>(${areaC[topArea]}명)입니다.</span></div>
      <div class="bsec"><h3>막힌 영역</h3>${AREAS.map((a,i)=>brow(a.t,areaC[i],arMax,i===topArea&&areaC[i]>0)).join("")}</div>
      <div class="bsec"><h3>함께 겪는 어려움 TOP ${sits.length}</h3>${sits.map(([k,c],i)=>{ const [a,si]=k.split(":").map(Number); return brow(AREAS[a].sits[si].t,c,sits[0][1],i===0,`${c>=2?'<span class="together">함께</span>':''}<small>${AREAS[a].t}</small>`); }).join("")}</div>
      <div class="bsec"><h3>먼저 손볼 요소</h3>${elOrder.map((k,i)=>brow(EL[k],elC[k],elMax,i<2&&elC[k]>0)).join("")}</div>
      <div class="bsec"><h3>많이 담은 처방 TOP ${rxs.length}</h3>${rxs.map(([id,c],i)=>brow(RX[id].t,c,rxs[0][1],i===0)).join("")}</div>`;
  }
  app.innerHTML = `<section class="slip"><div class="slip-head big"><span class="rxmark" aria-hidden="true">℞</span><div class="qh"><span class="eyebrow">연수실 결과표 · 익명</span><h2>우리가 함께 막힌 곳</h2></div></div><div class="body">${inner}
    <div class="row">${backBtn()}<button class="btn" data-act="refresh">새로고침</button><span class="ok" id="msg" hidden></span></div>
    <p class="hint">이름 없이 선택값만 모입니다. 새로 보내는 선생님이 있으면 이 화면이 저절로 갱신돼요.</p></div></section>`;
}
/* .docx 만들기: 정리 글을 줄 단위로 읽어 제목·소제목·목록으로 바꿉니다. */
function xesc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function para(text,opt){
  opt = opt||{};
  const ppr = (opt.style?`<w:pStyle w:val="${opt.style}"/>`:"")+(opt.left?`<w:ind w:left="${opt.left}" w:hanging="${opt.hang||0}"/>`:"");
  const rpr = (opt.bold?"<w:b/>":"")+(opt.italic?"<w:i/>":"");
  return `<w:p><w:pPr>${ppr}</w:pPr><w:r><w:rPr>${rpr}</w:rPr><w:t xml:space="preserve">${xesc(text)}</w:t></w:r></w:p>`;
}
function docxBody(text){
  const out = [para("Re-design 정리",{style:"Title"})];
  text.split("\n").forEach(line=>{
    if(!line.trim()) return;
    let m;
    if((m=line.match(/^\[(.+)\]$/))) out.push(para(m[1],{style:"Heading2"}));
    else if(/^\d+\. /.test(line)) out.push(para(line,{style:"Heading3"}));
    else if((m=line.match(/^\s+- (.*)$/))) out.push(para("• "+m[1],{left:560,hang:240}));
    else if((m=line.match(/^\s+(\S.*)$/))) out.push(para(m[1],{left:320}));
    else if(/^(내 수업|막힌 곳):/.test(line)) out.push(para(line,{bold:true}));
    else out.push(para(line));
  });
  return out.join("");
}
async function makeDocx(text){
  const zip = new JSZip();
  const put = (n,d)=>zip.file(n,d,{createFolders:false});
  put("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`);
  put("_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  put("word/_rels/document.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  const font = `<w:rFonts w:ascii="Malgun Gothic" w:hAnsi="Malgun Gothic" w:eastAsia="Malgun Gothic" w:cs="Malgun Gothic"/>`;
  put("word/styles.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr>${font}<w:sz w:val="21"/><w:szCs w:val="21"/><w:lang w:val="ko-KR" w:eastAsia="ko-KR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="100" w:line="320" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style><w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:after="240"/></w:pPr><w:rPr><w:b/><w:sz w:val="40"/><w:szCs w:val="40"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:pPr><w:keepNext/><w:spacing w:before="320" w:after="120"/><w:outlineLvl w:val="1"/></w:pPr><w:rPr><w:b/><w:sz w:val="30"/><w:szCs w:val="30"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading3"><w:name w:val="heading 3"/><w:basedOn w:val="Normal"/><w:pPr><w:keepNext/><w:spacing w:before="220" w:after="80"/><w:outlineLvl w:val="2"/></w:pPr><w:rPr><w:b/><w:sz w:val="25"/><w:szCs w:val="25"/></w:rPr></w:style></w:styles>`);
  put("word/document.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${docxBody(text)}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1304" w:bottom="1440" w:left="1304" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>`);
  return zip.generateAsync({type:"blob"});
}

async function saveFile(name, blob){
  try{
    const c = (window.claude && window.claude.use)? window.claude : null;
    const ns = c? await c.use("downloads"):null;
    if(ns){ await ns.save({filename:name, data:blob}); return; }
  }catch(err){ if(err && err.code==="declined") throw err; }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function setupDocx(){
  const btn = document.getElementById("docxBtn"); const help = document.getElementById("docsHelp");
  if(typeof JSZip!=="undefined"){ if(btn) btn.hidden=false; if(help) help.hidden=false; }
}
function flash(msg,id){
  const el = document.getElementById(id||"msg"); if(!el) return;
  el.textContent = msg; el.hidden = false; clearTimeout(flash.t); flash.t = setTimeout(()=>{ el.hidden=true; },4000);
}

app.addEventListener("input", e=>{ if(e.target.id==="lesson") st.lesson = e.target.value; });
app.addEventListener("click", async e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act, i = Number(b.dataset.i);
  if(act==="start") go("area");
  else if(act==="back") back();
  else if(act==="restart") restart();
  else if(act==="area"){ st.area=i; st.sit=null; st.cause=null; go("sit"); }
  else if(act==="sit"){ st.sit=i; st.cause=null; go(AREAS[st.area].sits[i].cs.length? "cause":"scenes"); }
  else if(act==="cause"){ st.cause=i; go("scenes"); }
  else if(act==="scene"){ if(st.scenes.has(i)) st.scenes.delete(i); else st.scenes.add(i); b.setAttribute("aria-pressed", st.scenes.has(i)); }
  else if(act==="result"){ st.picked = new Set(); st.init=false; go("result"); }
  else if(act==="pick"){
    const id = b.dataset.id; const on = !st.picked.has(id);
    if(on) st.picked.add(id); else st.picked.delete(id);
    b.setAttribute("aria-pressed", on); b.classList.toggle("primary", on); b.textContent = on? "담았어요":"내 재설계안에 담기";
    const it = b.closest(".item"); if(it) it.classList.toggle("picked", on);
    buildSummary();
  }
  else if(act==="filter"){
    st.filter = b.dataset.f;
    document.querySelectorAll(".chipbtn").forEach(c=>c.setAttribute("aria-pressed", c.dataset.f===st.filter));
    document.querySelectorAll(".item").forEach(el=>{ el.hidden = st.filter!=="all" && el.dataset.lv!==st.filter; });
  }
  else if(act==="board"){ go("board"); loadBoard(); }
  else if(act==="send"){ b.disabled=true; await sendMine(); b.disabled=false; }
  else if(act==="refresh"){ flash("불러오는 중…"); loadBoard(); }
  else if(act==="copy"){
    const ta = document.getElementById("out");
    const done = ()=>flash("복사했어요");
    const fallback = ()=>{ ta.focus(); ta.select(); try{ if(document.execCommand("copy")) done(); }catch(_){} };
    try{ navigator.clipboard.writeText(ta.value).then(done, fallback); }catch(_){ fallback(); }
  }
  else if(act==="docx"){
    const ta = document.getElementById("out");
    try{
      const blob = await makeDocx(ta.value);
      await saveFile("Re-design_정리.docx", blob);
      flash("저장했어요. 구글 드라이브에 올려 열어 보세요.");
    }catch(err){
      if(err && err.code==="declined") flash("저장을 취소했어요.");
      else if(err && err.code==="rate_limited") flash("잠시 뒤에 다시 눌러 주세요.");
      else flash("이 화면에서는 파일 저장을 쓸 수 없어요. ‘글 복사하기’를 이용해 주세요.");
    }
  }
});
render();
initShared();
</script>
